[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "journal-offset-map"
version = "0.1.0"
description = "Explain wall/monotonic clock discontinuities in journalctl JSON exports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []

[project.scripts]
journal-offset-map = "journal_offset_map.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/journal-offset-map"
Issues = "https://github.com/KanadeK/journal-offset-map/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
